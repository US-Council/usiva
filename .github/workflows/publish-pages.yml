name: Publish public GitHub Pages artifact

# Release model (US-Council/usiva#31): every push to main or release/live runs
# the full build and quality gates, but ONLY release/live publishes to gh-pages.
# main is the integration branch; promoting it to production is an explicit,
# owner-approved merge of main into release/live (see README, "Publishing").

on:
  push:
    branches:
      - main
      - release/live
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-artifact
  cancel-in-progress: false

jobs:
  build-and-publish:
    # Pushes and manual runs are limited to main (verify only) and release/live
    # (verify and publish); no other branch can build or publish.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/live'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
      TZ: UTC
    steps:
      - name: Checkout triggering source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse non-canonical repository
        shell: bash
        run: test "${GITHUB_REPOSITORY,,}" = "us-council/usiva"

      - name: Verify Astro source contract
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f pnpm-lock.yaml

      - name: Set up Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'

      - name: Set up locked pnpm
        shell: bash
        run: |
          set -euo pipefail
          pnpm_prefix="${RUNNER_TEMP}/pnpm"
          npm install --global --prefix "$pnpm_prefix" pnpm@11.22.0
          echo "$pnpm_prefix/bin" >> "$GITHUB_PATH"
          test "$("$pnpm_prefix/bin/pnpm" --version)" = "11.22.0"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --config.allowBuilds.esbuild=true

      - name: Build Astro static output
        run: pnpm run build

      - name: Run release quality gates
        run: |
          pnpm run check
          pnpm test
          pnpm run audit
          pnpm audit --prod

      - name: Validate and seal public artifact
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -s dist/index.html
          test -d dist/assets
          if [ -d dist/_astro ] || find dist -type f \
            -path '*/_astro/*' -print -quit | grep -q .; then
            echo 'Astro assets must use the non-underscore assets directory' >&2
            exit 1
          fi
          printf '%s\n' 'usiva.org' > dist/CNAME
          : > dist/.nojekyll
          test "$(cat dist/CNAME)" = "usiva.org"
          test ! -s dist/.nojekyll

      - name: Publish only dist to gh-pages
        # Production publishes come from release/live only. main stops after the
        # gates above, so unapproved content never reaches usiva.org.
        if: github.ref == 'refs/heads/release/live'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          artifact_dir="$(mktemp -d)"
          cp -a dist/. "$artifact_dir/"
          cd "$artifact_dir"
          git init --initial-branch=gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "Publish Astro build ${GITHUB_SHA}"
          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:gh-pages
